<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deal of the Day — Admin</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="section"><div class="section-head"><div><p class="eyebrow">ADMIN</p><h1>Deal of the Day</h1><p>Create and monitor daily product deals.</p></div><a class="text-btn" href="admin.html">← Admin Center</a></div>
<section class="checkout-card"><form id="dealForm"><label>Deal name<input id="name" required placeholder="Deal of the Day"></label><label>Start date/time<input id="starts" type="datetime-local" required></label><label>End date/time<input id="ends" type="datetime-local" required></label><label>Discount type<select id="type"><option value="percent">Percent</option><option value="fixed">Fixed ₹</option></select></label><label>Discount value<input id="discount" type="number" min="0.01" step="0.01" required></label><label>Products<select id="products" multiple size="8" required></select></label><button class="primary-btn" type="submit">Create Daily Deal</button><p id="message" class="checkout-note"></p></form></section>
<section class="section"><div class="section-head"><h2>Analytics</h2><button id="reload" class="text-btn">Refresh</button></div><div id="analytics"></div></section></main>
<script src="backend/supabase-client.js"></script><script src="admin-deals.js"></script></body></html>
