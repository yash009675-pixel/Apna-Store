<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barcode / QR Center — Apna Store</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav><a href="seller-dashboard.html">Seller Dashboard</a></nav></header><main class="seller-shell"><section class="seller-top"><div><p class="eyebrow">BARCODE / QR SYSTEM</p><h1>Code Center</h1><p>Generate product/SKU codes and search real product, order or shipment references.</p></div></section><section class="seller-panel"><label>Product ID <input id="pid" placeholder="Product UUID"></label><label>Variant ID <input id="vid" placeholder="Optional variant UUID"></label><label>Type <select id="type"><option value="barcode">Barcode</option><option value="qr">QR</option></select></label><button id="generate" class="seller-btn">Generate</button><pre id="generated" class="seller-message"></pre></section><section class="seller-panel"><label>Scan / Search code, SKU, order number or tracking number <input id="search" placeholder="Enter scanned value"></label><button id="find" class="seller-btn">Search</button><pre id="result" class="seller-message"></pre></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script>const $=id=>document.getElementById(id);generate.onclick=async()=>{generated.textContent="";const{data,error}=await apnaSupabase.rpc("generate_product_code",{p_product_id:pid.value,p_variant_id:vid.value||null,p_code_type:type.value});generated.textContent=error?error.message:JSON.stringify(data,null,2)};find.onclick=async()=>{result.textContent="";const{data,error}=await apnaSupabase.rpc("search_code",{p_code:search.value});result.textContent=error?error.message:JSON.stringify(data,null,2)}</script><script src="pwa.js"></script></body></html>
