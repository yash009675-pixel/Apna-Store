<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Packing Center — Apna Store</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav><a href="seller-dashboard.html">Seller Dashboard</a></nav></header><main class="seller-shell"><section class="seller-top"><div><p class="eyebrow">PACKING CENTER</p><h1>Packing Queue</h1><p>Real seller orders only. Packing status and verification are recorded server-side.</p></div><button id="refresh" class="seller-btn">Refresh</button></section><section class="seller-panel"><div id="table" class="seller-message">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script>const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function load(){const{data,error}=await apnaSupabase.rpc("get_packing_queue");if(error){$("table").textContent=error.message;return}const rows=data||[];if(!rows.length){$("table").textContent="No real orders are currently in the packing queue.";return}$("table").innerHTML='<table class="seller-table"><thead><tr><th>Order</th><th>Order status</th><th>Packing</th><th>Created</th><th>Packed</th><th>Verified</th><th>Action</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.order_number)+'</td><td>'+esc(r.seller_status||r.delivery_status)+'</td><td>'+esc(r.packing_status)+'</td><td>'+new Date(r.created_at).toLocaleString("en-IN")+'</td><td>'+(r.packed_at?new Date(r.packed_at).toLocaleString("en-IN"):"—")+'</td><td>'+((r.verified&&r.packing_status==="verified")?"Yes":"No")+'</td><td><button class="seller-btn" data-id="'+r.order_id+'" data-status="'+esc(r.packing_status)+'">Update</button></td></tr>').join("")+'</tbody></table>';document.querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{const status=prompt("Packing status: pending / packing / packed / verified",b.dataset.status);if(!status)return;const verify=status==="verified"&&confirm("Confirm package verification?");const{error}=await apnaSupabase.rpc("update_packing_status",{p_order_id:b.dataset.id,p_status:status,p_verify:verify});if(error)alert(error.message);else load()})}$("refresh").onclick=load;load()</script><script src="pwa.js"></script></body></html>
