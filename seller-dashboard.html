<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard — Apna Store</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><style>
.seller-shell{max-width:1180px;margin:0 auto;padding:32px 20px 70px}.seller-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:28px}.seller-top h1{margin:4px 0 8px}.seller-top p{margin:0;color:#666}.seller-actions{display:flex;gap:10px;flex-wrap:wrap}.seller-btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#111;text-decoration:none;font-weight:700}.seller-btn.primary{background:#111;color:#fff;border-color:#111}.seller-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}.seller-stat{background:#fff;border:1px solid #e7e7e7;border-radius:12px;padding:20px}.seller-stat span{display:block;color:#777;font-size:13px;margin-bottom:8px}.seller-stat strong{font-size:28px}.seller-panel{background:#fff;border:1px solid #e7e7e7;border-radius:12px;overflow:hidden;margin-bottom:22px}.seller-panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #eee}.seller-panel-head h2{margin:0;font-size:18px}.seller-table{width:100%;border-collapse:collapse}.seller-table th,.seller-table td{text-align:left;padding:14px 18px;border-bottom:1px solid #eee;font-size:14px}.seller-table th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#777}.seller-status{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1f1f1;font-size:12px}.seller-message{padding:30px;text-align:center;color:#666}.seller-error{color:#b42318}.seller-nav{display:flex;gap:16px;align-items:center}.seller-nav a{color:#111;text-decoration:none}@media(max-width:800px){.seller-top{flex-direction:column}.seller-grid{grid-template-columns:repeat(2,1fr)}.seller-panel{overflow-x:auto}.seller-table{min-width:700px}}@media(max-width:480px){.seller-grid{grid-template-columns:1fr 1fr}.seller-shell{padding:22px 14px 50px}.seller-stat strong{font-size:22px}}
</style></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav class="seller-nav"><a href="shop.html">Store</a><a href="account.html">Account</a><button class="seller-btn" id="signOut">Sign out</button></nav></header><main class="seller-shell"><section class="seller-top"><div><p class="eyebrow">SELLER CENTER</p><h1 id="sellerTitle">Seller Dashboard</h1><p id="sellerSubtitle">Manage your Apna Store catalog and orders.</p></div><div class="seller-actions"><a class="seller-btn primary" href="seller-product.html">+ Add product</a><a class="seller-btn" href="seller-products.html">Manage products</a><a class="seller-btn" href="seller-orders.html">Manage orders</a><a class="seller-btn" href="seller-earnings.html">Earnings</a></div></section><section class="seller-grid"><div class="seller-stat"><span>Products</span><strong id="productCount">—</strong></div><div class="seller-stat"><span>Active</span><strong id="activeCount">—</strong></div><div class="seller-stat"><span>Variants</span><strong id="variantCount">—</strong></div><div class="seller-stat"><span>Low stock</span><strong id="lowStockCount">—</strong></div><div class="seller-stat"><span>Orders</span><strong id="orderCount">—</strong></div><div class="seller-stat"><span>Gross sales</span><strong id="grossSales">—</strong></div></section><section class="seller-panel"><div class="seller-panel-head"><h2>Recent products</h2><a href="seller-products.html">View all →</a></div><div id="recentProducts" class="seller-message">Loading products…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script src="seller-dashboard.js?v=20260920-2"></script></body></html>
