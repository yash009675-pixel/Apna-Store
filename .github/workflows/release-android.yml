name: Apna Store Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Signed Android AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Prepare bundled web app
        run: |
          rm -rf mobile/www
          mkdir -p mobile/www
          find . -maxdepth 1 -type f ! -name ".gitignore" ! -name "package.json" -exec cp {} mobile/www/ \;
          cp -R backend mobile/www/backend

      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Sync Android
        working-directory: mobile
        run: npx cap sync android

      - name: Configure release signing
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apna-store-release.keystore

          echo "Validating Android keystore and signing credentials..."
          keytool -list             -keystore apna-store-release.keystore             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null

          rm -f /tmp/apna-store-signing-check.p12
          # The release keystore is PKCS12. PKCS12 uses the store password for
          # the private-key entry as well; a separate key password is ignored.
          if ! keytool -importkeystore             -srckeystore apna-store-release.keystore             -srcalias "$ANDROID_KEY_ALIAS"             -srcstorepass "$ANDROID_KEYSTORE_PASSWORD"             -destkeystore /tmp/apna-store-signing-check.p12             -deststoretype PKCS12             -deststorepass "validation-only"             -destkeypass "validation-only"             -noprompt >/tmp/apna-store-keytool-check.log 2>&1; then
            cat /tmp/apna-store-keytool-check.log
            echo "::error::The PKCS12 keystore could not unlock the private key with ANDROID_KEYSTORE_PASSWORD. Verify that secret against the original keystore; do not paste it into chat."
            exit 1
          fi
          rm -f /tmp/apna-store-signing-check.p12 /tmp/apna-store-keytool-check.log

          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("../apna-store-release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      // PKCS12 uses the same password for the key entry.
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release AAB
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload signed AAB
        uses: actions/upload-artifact@v6
        with:
          name: apna-store-signed-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f mobile/android/apna-store-release.keystore
