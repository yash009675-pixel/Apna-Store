<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coupon Center — Apna Store</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="styles.css"><style>
.coupon-shell{width:min(1240px,100%);margin:auto;padding:34px 20px 70px}.coupon-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}.coupon-head h1{margin:4px 0 8px}.coupon-head p{margin:0;color:#666}.coupon-actions{display:flex;gap:8px;flex-wrap:wrap}.coupon-btn{border:1px solid #ddd;background:#fff;color:#111;border-radius:8px;padding:10px 14px;font:inherit;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer}.coupon-btn.primary{background:#111;color:#fff;border-color:#111}.coupon-grid{display:grid;grid-template-columns:1fr 1.6fr;gap:18px}.coupon-panel{background:#fff;border:1px solid #e5e1da;border-radius:14px;overflow:hidden}.coupon-panel h2{font-size:18px;margin:0;padding:18px 20px;border-bottom:1px solid #eee}.coupon-form{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.coupon-form label{font-size:11px;font-weight:700;color:#555;display:flex;flex-direction:column;gap:6px}.coupon-form input,.coupon-form select,.coupon-form textarea{font:inherit;border:1px solid #d7d3cc;border-radius:8px;padding:10px 11px;background:#fff;min-width:0}.coupon-form textarea{min-height:70px;resize:vertical}.coupon-form .full{grid-column:1/-1}.coupon-form .checks{display:flex;gap:8px;align-items:center;font-weight:600}.coupon-form .checks input{width:auto}.multi{min-height:130px}.coupon-form-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}.coupon-message{padding:0 20px 16px;color:#666;font-size:12px}.coupon-error{color:#b42318}.coupon-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.coupon-stat{background:#fff;border:1px solid #e5e1da;border-radius:12px;padding:15px}.coupon-stat span{display:block;font-size:11px;color:#777;margin-bottom:6px}.coupon-stat strong{font-size:22px}.coupon-table-wrap{overflow:auto}.coupon-table{width:100%;min-width:900px;border-collapse:collapse}.coupon-table th,.coupon-table td{text-align:left;padding:12px 14px;border-bottom:1px solid #eee;font-size:12px;vertical-align:top}.coupon-table th{font-size:10px;text-transform:uppercase;color:#777;background:#faf9f6;white-space:nowrap}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef7ee;color:#176b2c;font-size:10px;font-weight:700}.pill.off{background:#f1f1f1;color:#888}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.row-actions button{border:1px solid #ddd;background:#fff;border-radius:7px;padding:6px 8px;font-size:11px;font-weight:700;cursor:pointer}.row-actions .danger{color:#b42318}@media(max-width:900px){.coupon-grid{grid-template-columns:1fr}.coupon-stats{grid-template-columns:1fr 1fr}}@media(max-width:600px){.coupon-shell{padding:24px 12px 55px}.coupon-head{flex-direction:column}.coupon-form{grid-template-columns:1fr;padding:16px}.coupon-form .full,.coupon-form-actions{grid-column:auto}.coupon-stats{gap:8px}.coupon-stat{padding:12px}.coupon-stat strong{font-size:19px}}
</style></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav><a href="shop.html">Store</a><a href="account.html">Account</a><a href="seller-dashboard.html">Dashboard</a></nav></header>
<main class="coupon-shell"><section class="coupon-head"><div><p class="eyebrow">COUPON CENTER</p><h1 id="title">Manage coupons</h1><p id="subtitle">Create, schedule and track real customer discounts.</p></div><div class="coupon-actions"><a class="coupon-btn" id="backLink" href="seller-dashboard.html">Dashboard</a></div></section>
<section class="coupon-stats"><div class="coupon-stat"><span>Coupons</span><strong id="statCoupons">—</strong></div><div class="coupon-stat"><span>Active</span><strong id="statActive">—</strong></div><div class="coupon-stat"><span>Redemptions</span><strong id="statRedemptions">—</strong></div><div class="coupon-stat"><span>Total discount</span><strong id="statDiscount">—</strong></div></section>
<section class="coupon-grid"><div class="coupon-panel"><h2 id="formTitle">Create coupon</h2><form id="couponForm" class="coupon-form">
<input id="couponId" type="hidden"><label>Code<input id="code" required maxlength="40" placeholder="SAVE10" autocomplete="off"></label><label>Name<input id="name" required maxlength="120" placeholder="10% off"></label>
<label>Discount type<select id="discountType"><option value="percent">Percentage</option><option value="fixed">Fixed amount</option></select></label><label>Discount value<input id="discountValue" required type="number" min="0.01" step="0.01"></label>
<label>Minimum cart value<input id="minOrder" type="number" min="0" step="0.01" value="0"></label><label>Maximum discount<input id="maxDiscount" type="number" min="0.01" step="0.01" placeholder="Optional"></label>
<label>Usage limit<input id="usageLimit" type="number" min="1" step="1" placeholder="Unlimited"></label><label>Per customer limit<input id="perUserLimit" type="number" min="1" step="1" value="1"></label>
<label>Starts<input id="startsAt" type="datetime-local"></label><label>Expires<input id="expiresAt" type="datetime-local"></label>
<label>Scope<select id="scope"><option value="all">All eligible items</option><option value="products">Selected products</option><option value="categories">Selected categories</option></select></label><label class="checks"><input id="firstOrder" type="checkbox"> First order only</label>
<label id="productsField" class="full" hidden>Products<select id="products" class="multi" multiple></select></label><label id="categoriesField" class="full" hidden>Categories<select id="categories" class="multi" multiple></select></label>
<label class="full">Description<textarea id="description" maxlength="500" placeholder="Optional customer-facing description"></textarea></label>
<label class="checks"><input id="active" type="checkbox" checked> Active</label>
<div class="coupon-form-actions"><button class="coupon-btn primary" type="submit">Save coupon</button><button class="coupon-btn" id="cancelEdit" type="button" hidden>Cancel edit</button></div>
</form><div id="message" class="coupon-message">Loading…</div></div>
<div class="coupon-panel"><h2>Coupon history & analytics</h2><div id="list" class="coupon-table-wrap"><div class="coupon-message">Loading…</div></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script src="coupon-center.js?v=20260922-14"></script><script src="apna-ai.js?v=20260920-3"></script><script src="pwa.js?v=20260920-1"></script></body></html>
