<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Center | Apna Store</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="styles.css"><style>.support-shell{max-width:1100px;margin:40px auto 80px;padding:0 18px}.support-grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.support-panel{background:#fff;border:1px solid #e7e7e7;border-radius:14px;padding:18px;margin-bottom:18px}.support-panel h2{margin:0 0 14px}.support-form{display:grid;gap:11px}.support-form input,.support-form select,.support-form textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:8px;background:#fff}.support-form textarea{min-height:110px;resize:vertical}.support-btn{padding:10px 14px;border:1px solid #111;background:#111;color:#fff;border-radius:8px;font-weight:700;cursor:pointer}.ticket-list{display:grid;gap:9px}.ticket-item{padding:12px;border:1px solid #eee;border-radius:10px;background:#fafafa;cursor:pointer}.ticket-item.active{border-color:#111;background:#f5f5f5}.ticket-item strong{display:block}.ticket-item small{color:#777}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#eee;font-size:11px}.ticket-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid #eee;padding-bottom:14px;margin-bottom:14px}.messages{display:grid;gap:10px;max-height:480px;overflow:auto;margin-bottom:14px}.msg{padding:11px 13px;border-radius:10px;background:#f4f4f4}.msg.me{background:#111;color:#fff}.msg small{display:block;opacity:.7;margin-bottom:5px}.attachment-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.attachment-list a{font-size:12px}.admin-controls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.hidden{display:none!important}.muted{color:#777}.error{color:#b42318}@media(max-width:800px){.support-grid{grid-template-columns:1fr}.admin-controls{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav><a href="shop.html">Shop</a> · <a href="help.html">Help Center</a> · <a href="account.html">Account</a></nav></header><main class="support-shell"><p class="eyebrow">APNA STORE</p><h1>Support Center</h1><p class="muted">Create a real support ticket and continue the conversation with the Apna Store support team.</p><div id="authMessage" class="support-panel">Checking account…</div><div id="app" class="support-grid hidden"><section><div id="newPanel" class="support-panel"><h2>New Ticket</h2><form id="newTicket" class="support-form"><label>Category<select id="category"><option value="order">Order</option><option value="payment">Payment</option><option value="delivery">Delivery</option><option value="return">Return</option><option value="refund">Refund</option><option value="account">Account</option><option value="product">Product</option><option value="listing">Listing</option><option value="inventory">Inventory</option><option value="payout">Payout</option><option value="courier">Courier</option><option value="ads">Ads</option><option value="other">Other</option></select></label><label>Priority<select id="priority"><option value="normal">Normal</option><option value="low">Low</option><option value="high">High</option><option value="urgent">Urgent</option></select></label><label>Subject<input id="subject" maxlength="160" required></label><label>Message<textarea id="firstMessage" maxlength="10000" required></textarea></label><label>Order ID (optional)<input id="orderId"></label><label>Shipment ID (optional)<input id="shipmentId"></label><label>Attachment (optional)<input id="attachment" type="file" accept="image/jpeg,image/png,image/webp,application/pdf,text/plain"></label><button class="support-btn" type="submit">Create ticket</button><div id="newMessage" class="muted"></div></form></div><div class="support-panel"><h2>Tickets</h2><div id="ticketList">Loading…</div></div></section><section class="support-panel"><div id="ticketEmpty" class="muted">Select a ticket to view messages.</div><div id="ticketView" class="hidden"><div class="ticket-head"><div><strong id="ticketCode"></strong><div id="ticketSubject"></div><small id="ticketMeta" class="muted"></small></div><span id="ticketStatus" class="badge"></span></div><div id="adminControls" class="admin-controls hidden"><select id="adminStatus"><option value="open">Open</option><option value="ai_handling">AI Handling</option><option value="waiting_for_user">Waiting for User</option><option value="assigned">Assigned</option><option value="in_progress">In Progress</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select><select id="adminPriority"><option value="low">Low</option><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select><input id="adminAgent" placeholder="Assigned agent UUID (optional)"><input id="adminResolution" placeholder="Resolution"><button id="saveAdmin" class="support-btn">Save ticket</button></div><div id="aiSummary" class="support-panel muted"></div><button id="generateSummary" class="support-btn" type="button">Generate AI Summary</button><div id="messages" class="messages"></div><div id="attachments" class="attachment-list"></div><form id="replyForm" class="support-form"><textarea id="reply" maxlength="10000" placeholder="Write a reply…" required></textarea><button class="support-btn" type="submit">Send message</button></form></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script src="support-center.js?v=20260923-1"></script><script src="apna-ai.js?v=20260920-3"></script><script src="pwa.js?v=20260920-1"></script></body></html>
