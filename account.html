<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — Apna Store</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav><a href="shop.html">Shop</a><a href="wishlist.html">Wishlist</a><a href="orders.html">Orders</a><a href="cart.html">Bag</a></nav></header><main class="account-page"><div class="account-card"><p class="eyebrow">APNA ACCOUNT</p><h1 id="accountTitle">Shopping, made personal.</h1><p id="accountStatus">Checking your account…</p><div class="account-stats"><a href="orders.html"><b id="orderCount">0</b><span>Orders</span></a><a href="wishlist.html"><b id="wishCount">0</b><span>Wishlist</span></a><a href="cart.html"><b id="bagCount">0</b><span>Bag items</span></a></div><section class="account-panel" id="profilePanel" hidden><p class="eyebrow">PROFILE</p><h2>Your details.</h2><form id="profileForm" class="account-form"><label>Full name<input id="profileName" required maxlength="100"></label><label>Email<input id="profileEmail" type="email" disabled></label><button class="primary-btn" type="submit">Save profile →</button><p id="profileMessage" class="checkout-note"></p></form></section><section class="account-panel" id="addressPanel" hidden><p class="eyebrow">SAVED ADDRESSES</p><h2>Your addresses.</h2><form id="addressForm" class="account-form"><input id="addressId" type="hidden"><label>Full name<input id="addressName" required maxlength="100"></label><label>Phone<input id="addressPhone" required inputmode="numeric" maxlength="10"></label><label>Address<input id="addressLine" required maxlength="250"></label><label>City<input id="addressCity" required maxlength="80"></label><label>State<input id="addressState" required maxlength="80"></label><label>Pincode<input id="addressPincode" required inputmode="numeric" maxlength="6"></label><label class="check-row"><input id="addressDefault" type="checkbox"> Make this my default address</label><div class="form-actions"><button class="primary-btn" type="submit">Save address →</button><button id="cancelAddress" type="button" hidden>Cancel edit</button></div><p id="addressMessage" class="checkout-note"></p></form><div id="addressList"></div></section><div class="account-actions" id="accountActions"></div><p class="checkout-note" id="accountNote">Sign in to keep your orders and wishlist connected to your account.</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script src="account.js?v=20260920-1"></script><style>.account-panel{margin-top:28px;background:#faf9f6;border:1px solid #e3e0da;padding:30px}.account-panel h2{margin:0;font-size:30px}.account-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px;max-width:800px}.account-form label{display:flex;flex-direction:column;gap:7px;font-size:11px;font-weight:700}.account-form input{border:1px solid #d6d3cc;background:#fff;padding:12px;font:inherit;font-size:12px}.account-form .primary-btn{border:0;cursor:pointer}.check-row{flex-direction:row!important;align-items:center}.form-actions{display:flex;gap:10px}.address-card{background:#fff;border:1px solid #e3e0da;padding:20px;margin-top:12px;max-width:800px}.address-card p{font-size:12px;line-height:1.7;color:#666}.default-badge{margin-left:10px;background:#111;color:#fff;padding:4px 7px;font-size:9px}.address-actions{display:flex;gap:8px;flex-wrap:wrap}.address-actions button{cursor:pointer;border:1px solid #d6d3cc;background:#fff;padding:9px 12px;font:inherit;font-size:11px}@media(max-width:700px){.account-form{grid-template-columns:1fr}.account-panel{padding:20px}}</style><script>
let localWish=[],cart=[];try{localWish=JSON.parse(localStorage.getItem("apnaWishlist")||"[]")}catch{}try{cart=JSON.parse(localStorage.getItem("apnaCart")||"[]")}catch{}
document.getElementById("bagCount").textContent=cart.reduce((s,x)=>s+(Number(x?.qty)||0),0);
(async()=>{const {data}=await apnaSupabase.auth.getSession();const session=data.session;const actions=document.getElementById("accountActions");if(session){const {data:profile}=await apnaSupabase.from("profiles").select("full_name,role").eq("id",session.user.id).single();const name=profile?.full_name||session.user.user_metadata?.full_name||session.user.email;document.getElementById("accountTitle").textContent="Welcome, "+name+".";document.getElementById("accountStatus").textContent=session.user.email;const [{count:orderCount},{count:wishCount}]=await Promise.all([apnaSupabase.from("orders").select("id",{count:"exact",head:true}).eq("user_id",session.user.id),apnaSupabase.from("wishlists").select("id",{count:"exact",head:true}).eq("user_id",session.user.id)]);document.getElementById("orderCount").textContent=orderCount||0;document.getElementById("wishCount").textContent=wishCount||0;document.getElementById("accountNote").textContent="Your orders and wishlist are connected to your Apna Store account.";actions.innerHTML=(profile?.role==="seller"||profile?.role==="admin"?'<a class="primary-btn" href="seller-dashboard.html">Open Seller Dashboard →</a>':'')+'<button class="primary-btn" id="signOut">Sign out →</button><a href="shop.html">Continue shopping</a>';document.getElementById("signOut").onclick=async()=>{await apnaSupabase.auth.signOut();location.reload();};}else{document.getElementById("orderCount").textContent="0";document.getElementById("wishCount").textContent=localWish.length;document.getElementById("accountStatus").textContent="Sign in to access your Apna Store account.";actions.innerHTML='<a class="primary-btn" href="auth.html">Sign in / Create account →</a><a href="shop.html">Continue shopping</a>';}})();
</script></body></html>
