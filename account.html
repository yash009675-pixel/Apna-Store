<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — Apna Store</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav><a href="shop.html">Shop</a><a href="wishlist.html">Wishlist</a><a href="orders.html">Orders</a><a href="notifications.html">Notifications</a><a href="cart.html">Bag</a></nav></header><main class="account-page"><div class="account-card"><p class="eyebrow">APNA ACCOUNT</p><h1 id="accountTitle">Shopping, made personal.</h1><p id="accountStatus">Checking your account…</p><div class="account-stats"><a href="orders.html"><b id="orderCount">0</b><span>Orders</span></a><a href="notifications.html"><b id="notificationCount">0</b><span>Notifications</span></a><a href="wishlist.html"><b id="wishCount">0</b><span>Wishlist</span></a><a href="cart.html"><b id="bagCount">0</b><span>Bag items</span></a></div><section class="account-panel" id="profilePanel" hidden><p class="eyebrow">PROFILE</p><h2>Your details.</h2><form id="profileForm" class="account-form"><label>Full name<input id="profileName" required maxlength="100"></label><label>Email<input id="profileEmail" type="email" disabled></label><button class="primary-btn" type="submit">Save profile →</button><p id="profileMessage" class="checkout-note"></p></form></section><section class="account-panel" id="addressPanel" hidden><p class="eyebrow">SAVED ADDRESSES</p><h2>Your addresses.</h2><form id="addressForm" class="account-form"><input id="addressId" type="hidden"><label>Full name<input id="addressName" required maxlength="100"></label><label>Phone<input id="addressPhone" required inputmode="numeric" maxlength="10"></label><label>Address<input id="addressLine" required maxlength="250"></label><label>City<input id="addressCity" required maxlength="80"></label><label>State<input id="addressState" required maxlength="80"></label><label>Pincode<input id="addressPincode" required inputmode="numeric" maxlength="6"></label><label class="check-row"><input id="addressDefault" type="checkbox"> Make this my default address</label><div class="form-actions"><button class="primary-btn" type="submit">Save address →</button><button id="cancelAddress" type="button" hidden>Cancel edit</button></div><p id="addressMessage" class="checkout-note"></p></form><div id="addressList"></div></section><div class="account-actions" id="accountActions"></div><p class="checkout-note" id="accountNote">Sign in to keep your orders and wishlist connected to your account.</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script src="account.js?v=20260920-25"></script><script src="apna-ai.js?v=20260920-2"></script></body></html>
