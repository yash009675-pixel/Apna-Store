<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — Apna Store</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav><a href="shop.html">Shop</a><a href="wishlist.html">Wishlist</a><a href="orders.html">Orders</a><a href="cart.html">Bag</a></nav></header><main class="account-page"><div class="account-card"><p class="eyebrow">APNA ACCOUNT</p><h1 id="accountTitle">Shopping, made personal.</h1><p id="accountStatus">Checking your account…</p><div class="account-stats"><a href="orders.html"><b id="orderCount">0</b><span>Orders</span></a><a href="wishlist.html"><b id="wishCount">0</b><span>Wishlist</span></a><a href="cart.html"><b id="bagCount">0</b><span>Bag items</span></a></div><div class="account-actions" id="accountActions"></div><p class="checkout-note" id="accountNote">Sign in to keep your orders and wishlist connected to your account.</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script>
const localOrders=JSON.parse(localStorage.getItem("apnaOrders")||"[]"),localWish=JSON.parse(localStorage.getItem("apnaWishlist")||"[]"),cart=JSON.parse(localStorage.getItem("apnaCart")||"[]");
document.getElementById("bagCount").textContent=cart.reduce((s,x)=>s+(x.qty||0),0);
(async()=>{const {data}=await apnaSupabase.auth.getSession();const session=data.session;const actions=document.getElementById("accountActions");if(session){const name=session.user.user_metadata?.full_name||session.user.email;document.getElementById("accountTitle").textContent="Welcome, "+name+".";document.getElementById("accountStatus").textContent=session.user.email;const [{count:orderCount},{count:wishCount}]=await Promise.all([apnaSupabase.from("orders").select("id",{count:"exact",head:true}).eq("user_id",session.user.id),apnaSupabase.from("wishlists").select("id",{count:"exact",head:true}).eq("user_id",session.user.id)]);document.getElementById("orderCount").textContent=orderCount||0;document.getElementById("wishCount").textContent=wishCount||0;document.getElementById("accountNote").textContent="Your orders and wishlist are connected to your Apna Store account.";actions.innerHTML='<button class="primary-btn" id="signOut">Sign out →</button><a href="shop.html">Continue shopping</a>';document.getElementById("signOut").onclick=async()=>{await apnaSupabase.auth.signOut();location.reload();};}else{document.getElementById("orderCount").textContent=localOrders.length;document.getElementById("wishCount").textContent=localWish.length;document.getElementById("accountStatus").textContent="You are currently shopping as a guest on this device.";actions.innerHTML='<a class="primary-btn" href="auth.html">Sign in / Create account →</a><a href="shop.html">Continue shopping</a>';}})();
</script></body></html>
