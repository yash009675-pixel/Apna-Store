<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — Apna Store</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav><a href="shop.html">Shop</a><a href="wishlist.html">Wishlist</a><a href="orders.html">Orders</a><a href="cart.html">Bag</a></nav></header><main class="account-page"><div class="account-card"><p class="eyebrow">APNA ACCOUNT</p><h1>Shopping, made personal.</h1><p id="accountStatus">You are currently shopping as a guest on this device.</p><div class="account-stats"><a href="orders.html"><b id="orderCount">0</b><span>Orders</span></a><a href="wishlist.html"><b id="wishCount">0</b><span>Wishlist</span></a><a href="cart.html"><b id="bagCount">0</b><span>Bag items</span></a></div><div class="account-actions"><button class="primary-btn" onclick="guest()">Continue shopping →</button><a href="orders.html">View orders</a></div><p class="checkout-note">Real sign-in, cloud-saved accounts and secure order history will be connected when the backend is added.</p></div></main><script>function guest(){localStorage.setItem("apnaGuest","true");location.href="shop.html"}const orders=JSON.parse(localStorage.getItem("apnaOrders")||"[]"),wish=JSON.parse(localStorage.getItem("apnaWishlist")||"[]"),cart=JSON.parse(localStorage.getItem("apnaCart")||"[]");document.getElementById("orderCount").textContent=orders.length;document.getElementById("wishCount").textContent=wish.length;document.getElementById("bagCount").textContent=cart.reduce((s,x)=>s+(x.qty||0),0);</script></body></html>
