<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash Sale Center — Apna Store</title><link rel="stylesheet" href="styles.css"></head><body><main class="page-shell"><section class="page-hero"><p class="eyebrow">ADMIN</p><h1>⚡ Flash Sale Center</h1><p>Create real time-bound sales using active catalog products. No demo data is seeded.</p></section><section class="checkout-card"><h2>Create Flash Sale</h2><form id="saleForm"><input id="saleName" placeholder="Sale name" required maxlength="120"><div class="form-grid"><label>Start <input id="startAt" type="datetime-local" required></label><label>End <input id="endAt" type="datetime-local" required></label><label>Discount <select id="discountType"><option value="percent">Percent</option><option value="fixed">Fixed ₹</option></select></label><label>Value <input id="discountValue" type="number" min="0.01" step="0.01" required></label></div><div><h3>Select products + stock limit</h3><div id="productPicker"></div></div><button class="primary-btn" type="submit">Create Flash Sale</button><p id="saleMessage"></p></form></section><section class="checkout-card"><h2>Flash Sale Analytics</h2><div id="analytics"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script src="admin-flash-sales.js"></script></body></html>
