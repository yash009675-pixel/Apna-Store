<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner Services Admin — Apna Store</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="styles.css"><style>.wrap{max-width:1120px;margin:auto;padding:32px 20px 70px}.panel{background:#fff;border:1px solid #e6e6e6;border-radius:14px;padding:20px;margin-bottom:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:6px}.field input,.field textarea,.field select{font:inherit;padding:10px;border:1px solid #d8d8d8;border-radius:8px}.field textarea{min-height:90px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border:1px solid #ddd;border-radius:8px;background:#fff;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff;border-color:#111}.danger{color:#b42318}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:12px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;font-size:13px}.status{font-size:12px;font-weight:700}.muted{color:#777}.msg{margin:10px 0}@media(max-width:700px){.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav><a href="admin.html">Admin</a><a href="partner-services.html">Public directory</a></nav></header><main class="wrap"><p class="eyebrow">ADMIN CENTER</p><h1>Partner Services</h1><p class="muted">Add only real providers after verification. Unverified or inactive records never appear in the public directory.</p><section class="panel"><form id="form" class="form"><input id="id" type="hidden"><label class="field"><span>Service type</span><select id="serviceType" required><option>Cataloging</option><option>Product Photography</option><option>Image Editing</option><option>Tax / GST Assistance</option><option>Accounting</optio
