<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Apna Store</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav><a href="shop.html">Continue shopping</a><a href="cart.html">Bag</a></nav></header><main class="checkout-page"><section><p class="eyebrow">CHECKOUT</p><h1>Complete your order.</h1><form id="checkoutForm"><div class="checkout-card"><h2>Contact & delivery</h2><div class="form-grid"><label>Full name<input id="name" required autocomplete="name"></label><label>Phone number<input id="phone" required inputmode="tel" pattern="[0-9]{10}" maxlength="10" autocomplete="tel"></label><label class="full">Address<input id="address" required autocomplete="street-address"></label><label>City<input id="city" required autocomplete="address-level2"></label><label>State<input id="state" required autocomplete="address-level1"></label><label>Pincode<input id="pincode" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="postal-code"></label></div></div><div class="checkout-card"><h2>Delivery</h2><label class="choice"><input type="radio" name="delivery" value="Standard Delivery" checked> Standard delivery <span>3–7 days</span></label></div><div class="checkout-card"><h2>Payment</h2><label class="choice"><input type="radio" name="payment" value="Cash on Delivery" checked> Cash on Delivery <span>Available</span></label><label class="choice"><input type="radio" name="payment" value="Online Payment" disabled> Online payment <span>Coming soon</span></label></div><button class="primary-btn checkout-submit" type="submit">Place order →</button><p class="checkout-note" id="checkoutNote">Sign in to place your order. Your order will be securely saved to your Apna Store account.</p></form></section><aside id="checkoutSummary"></aside></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script src="checkout.js?v=20260920-6"></script><script src="apna-ai.js?v=20260920-2"></script></body></html>
