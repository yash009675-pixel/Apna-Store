<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Editor — Apna Store</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><style>.wrap{max-width:900px;margin:auto;padding:30px 20px 70px}.form{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-weight:700;font-size:13px}input,textarea,select{font:inherit;padding:11px 12px;border:1px solid #d8d8d8;border-radius:8px;background:#fff}textarea{min-height:120px;resize:vertical}.variants{margin-top:24px}.variant{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:9px}.btn{padding:10px 15px;border:1px solid #ddd;border-radius:8px;background:#fff;font-weight:700;cursor:pointer}.dark{background:#111;color:#fff;border-color:#111}.remove{color:#b42318}.save{margin-top:22px}.images{margin-top:24px}.image-list{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.image-item{width:150px;border:1px solid #ddd;padding:8px}.image-item img{width:100%;height:120px;object-fit:cover;display:block}.image-item label{display:block;margin:7px 0}.msg{margin:14px 0}.error{color:#b42318}@media(max-width:700px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.variant{grid-template-columns:1fr 1fr}.variant button{grid-column:1/-1}}</style></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav><a href="seller-dashboard.html">Dashboard</a><a href="seller-products.html">Products</a></nav></header><main class="wrap"><p class="eyebrow">SELLER CENTER</p><h1 id="heading">Add product</h1><p>Create your product with images, variants and stock. Images are uploaded securely to your product after saving.</p><form class="form" id="form"><div class="grid"><div class="field"><label>Product name</label><input id="name" required maxlength="160"></div><div class="field"><label>Category</label><select id="category" required></select></div><div class="field"><label>Brand</label><select id="brand"><option value="">No brand</option></select></div><div class="field full"><label>Description</label><textarea id="description"></textarea></div><div class="field"><label>Selling price (₹)</label><input id="price" type="number" min="0" step="0.01" required></div><div class="field"><label>MRP / Compare price (₹)</label><input id="compare" type="number" min="0" step="0.01"></div><div class="field"><label>Status</label><select id="status"><option value="draft">Draft</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div></div><div class="images"><h2>Product images</h2><p>JPG, PNG or WebP • max 5 MB each.</p><input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="imageList" class="image-list"></div></div><div class="variants"><h2>Variants</h2><p>At least one variant is recommended. Add size/color/SKU/stock.</p><div id="variantRows"></div><button type="button" class="btn" id="addVariant">+ Add variant</button></div><div id="msg" class="msg"></div><button class="btn dark save" id="save">Save product →</button></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script src="seller-product.js?v=20260920-23"></script><script src="apna-ai.js?v=20260920-3"></script></body></html>
