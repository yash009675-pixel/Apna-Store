<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplier & Procurement — Apna Store</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav><a href="seller-dashboard.html">Seller Dashboard</a></nav></header><main class="seller-shell"><section class="seller-top"><div><p class="eyebrow">SUPPLIER / PROCUREMENT</p><h1>Procurement Center</h1><p>Supplier and purchase-order foundation. Only your supplier and procurement data is shown.</p></div></section><section class="seller-grid"><div class="seller-stat"><span>Suppliers</span><strong id="suppliers">—</strong></div><div class="seller-stat"><span>Purchase Orders</span><strong id="orders">—</strong></div><div class="seller-stat"><span>Purchase Value</span><strong id="value">—</strong></div><div class="seller-stat"><span>Received</span><strong id="received">—</strong></div></section><section class="seller-panel"><div id="msg" class="seller-message">Loading procurement report…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script>async function load(){const{data,error}=await apnaSupabase.rpc("get_procurement_report");if(error){msg.textContent=error.message;return}suppliers.textContent=data.suppliers;orders.textContent=data.purchase_orders;value.textContent="₹"+Number(data.purchase_value||0).toLocaleString("en-IN");received.textContent=data.received_orders;msg.textContent="No supplier or purchase-order records are seeded. Add real suppliers before creating procurement activity."}load()</script><script src="pwa.js"></script></body></html>
