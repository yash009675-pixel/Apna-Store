<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel — Apna Store</title><link rel="stylesheet" href="styles.css"><style>.admin-shell{max-width:1180px;margin:auto;padding:30px 18px 70px}.admin-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:25px}.admin-head h1{margin:5px 0}.admin-head p{color:#666}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}.admin-card{background:#fff;border:1px solid #e6e6e6;border-radius:12px;padding:20px}.admin-card span{display:block;color:#777;font-size:13px;margin-bottom:8px}.admin-card strong{font-size:28px}.admin-panel{background:#fff;border:1px solid #e6e6e6;border-radius:12px;overflow:hidden}.admin-panel-head{padding:18px 20px;border-bottom:1px solid #eee}.admin-panel-head h2{margin:0}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{text-align:left;padding:14px 16px;border-bottom:1px solid #eee;font-size:14px;vertical-align:top}.admin-table th{font-size:12px;text-transform:uppercase;color:#777}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-actions button{border:1px solid #ddd;background:#fff;border-radius:7px;padding:8px 10px;font-weight:700}.admin-actions .approve{background:#111;color:#fff;border-color:#111}.admin-message{padding:28px;text-align:center;color:#666}.admin-error{color:#b42318}@media(max-width:750px){.admin-head{flex-direction:column}.admin-grid{grid-template-columns:1fr 1fr}.admin-panel{overflow:auto}.admin-table{min-width:850px}}@media(max-width:450px){.admin-grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav><a href="seller-dashboard.html">Seller Center</a> · <a href="account.html">Account</a></nav></header><main class="admin-shell"><section class="admin-head"><div><p class="eyebrow">ADMIN CENTER</p><h1>Apna Store Admin</h1><p>Manage seller applications and review marketplace access.</p></div></section><section class="admin-grid"><div class="admin-card"><span>Pending seller applications</span><strong id="pending">—</strong></div><div class="admin-card"><span>Approved applications</span><strong id="approved">—</strong></div><div class="admin-card"><span>Rejected applications</span><strong id="rejected">—</strong></div></section><section class="admin-panel"><div class="admin-panel-head"><h2>Seller applications</h2></div><div id="applications" class="admin-message">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script src="admin.js?v=20260920-21"></script></body></html>
