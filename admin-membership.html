<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership Plans — Admin</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="styles.css"></head><body><main class="container" style="max-width:1100px;margin:0 auto;padding:24px 16px"><div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><div><p class="eyebrow">ADMIN</p><h1>Membership Plans</h1><p class="muted">Create and manage monthly/yearly membership plans.</p></div><a class="btn secondary" href="admin.html">Back to Admin</a></div><section class="card" style="margin:20px 0"><form id="planForm" class="account-form"><input id="planId" type="hidden"><label>Name<input id="planName" required maxlength="80"></label><label>Slug<input id="planSlug" required maxlength="80"></label><label>Billing interval<select id="interval"><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></label><label>Price (INR)<input id="price" type="number" min="0" step="0.01" required></label><label>Benefits (one per line)<textarea id="benefits" rows="5"></textarea></label><label class="check-row"><input id="active" type="checkbox" checked> Active</label><label>Sort order<input id="sortOrder" type="number" min="0" step="1" value="0"></label><div class="form-actions"><button class="primary-btn" type="submit">Save plan →</button><button type="button" id="reset">New plan</button></div><p id="message" class="checkout-note"></p></form></section><section><h2>Configured Plans</h2><div id="list" class="card muted">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script src="admin-membership.js"></script></body></html>
