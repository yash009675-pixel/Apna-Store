<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery Route — Apna Store</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="index.html">APNA<span>STORE</span></a><nav><a href="seller-dashboard.html">Seller Dashboard</a></nav></header><main class="seller-shell"><section class="seller-top"><div><p class="eyebrow">DELIVERY ROUTE</p><h1>Route Planning</h1><p>Real forward shipments are listed for route planning. Distance and ETA are shown only when reliable provider coordinates/routing data exist.</p></div><button id="refresh" class="seller-btn">Refresh</button></section><section class="seller-panel"><div id="message" class="seller-message">Loading…</div><div id="table"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend/supabase-client.js"></script><script>const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function load(){const{data,error}=await apnaSupabase.rpc("get_delivery_route_data");if(error){message.textContent=error.message;return}const rows=data||[];if(!rows.length){message.textContent="No real forward shipments are currently available for route planning.";table.innerHTML="";return}message.textContent="Route optimization is not fabricated: provider GPS/routing data is required for reliable distance, ETA and optimized sequencing.";table.innerHTML='<table class="seller-table"><thead><tr><th>Shipment</th><th>AWB</th><th>Status</th><th>Destination</th><th>ETA</th><th>Distance</th><th>Sequence</th></tr></thead><tbody>'+rows.map((r,i)=>{const a=r.address||{};return '<tr><td>'+esc(r.shipment_id)+'</td><td>'+esc(r.awb||"—")+'</td><td>'+esc(r.status)+'</td><td>'+esc([a.address,a.city,a.state,a.pincode].filter(Boolean).join(", ")||"Not available")+'</td><td>'+esc(r.estimated_delivery_date||"—")+'</td><td>—</td><td>'+ (i+1) +'</td></tr>'}).join("")+'</tbody></table>'}$("refresh").onclick=load;load()</script><script src="pwa.js"></script></body></html>
